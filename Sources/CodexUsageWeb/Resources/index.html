<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#141615">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="referrer" content="no-referrer">
  <title>Codex-Usage Web Deck</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/deck.css">
  <script src="/deck.js" defer></script>
</head>
<body>
  <main class="remote" aria-label="Codex model deck">
    <div id="presets" class="deck-grid" aria-label="Model presets and usage" aria-busy="true">
      <button id="usage-key" type="button" class="deck-key usage-key" aria-label="Usage unavailable. Open deck controls" aria-haspopup="dialog">
        <span class="key-top"><span>Usage</span><span class="settings-icon" aria-hidden="true">···</span></span>
        <span class="usage-dial">
          <svg viewBox="0 0 120 120" aria-hidden="true"><circle class="ring-track" cx="60" cy="60" r="52"/><circle id="usage-ring" class="ring-value" cx="60" cy="60" r="52" pathLength="100" stroke-dasharray="0 100"/></svg>
          <span class="usage-reading"><span id="usage-value">—</span><span class="usage-caption">remaining</span></span>
        </span>
      </button>
    </div>
    <section id="pairing" class="pairing" aria-labelledby="pairing-title" hidden>
      <h1 id="pairing-title">Connect to your Mac</h1>
      <p>Open Web Deck in the Codex-Usage menu on your Mac and scan a new pairing QR code.</p>
      <p class="secondary">Keep both devices on the same Wi-Fi.</p>
      <button id="retry-pairing" type="button" class="control-button">Check connection</button>
    </section>
    <div id="notice" class="notice" hidden><p id="notice-text"></p><button id="dismiss-notice" type="button" aria-label="Dismiss notification">×</button></div>
    <p id="feedback" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></p>
    <noscript><p class="notice">Enable JavaScript to use the deck.</p></noscript>
  </main>
  <dialog id="controls" aria-labelledby="controls-title">
    <div class="dialog-heading"><h2 id="controls-title">Deck controls</h2><button id="close-controls" type="button" aria-label="Close controls">×</button></div>
    <p id="connection-label" class="secondary">Connecting</p>
    <p class="field-label">Active chat</p><p id="target-title">Waiting for Codex…</p>
    <p id="usage-details" class="secondary"></p>
    <div class="control-grid">
      <button id="fullscreen" type="button" class="control-button">Enter full screen</button>
      <button id="sound" type="button" class="control-button" aria-pressed="true">Sound on</button>
      <button id="refresh" type="button" class="control-button">Refresh</button>
      <button id="logout" type="button" class="control-button" hidden>Disconnect</button>
    </div>
    <p id="fullscreen-help" class="secondary" hidden></p>
  </dialog>
</body>
</html>
