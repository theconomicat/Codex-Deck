name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test
        run: |
          swift test
          node --test Tests/DirectSwitching/apply-preset.test.mjs
          swift run CodexUsage --validate-presets presets.example.json
